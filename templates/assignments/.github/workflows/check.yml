# Checks that the reports render on a clean computer from what is in the repository.
# Runs on every pull request. Green = anyone can reproduce your reports.
# Works for Python and R: it installs the language your reports use.
name: check

on:
  pull_request:
  workflow_dispatch:

# A newer push cancels the run still going for the same pull request.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Report renders from a fresh clone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Find the language of your reports
        id: lang
        run: |
          if grep -qsE '^[[:space:]]*```+[[:space:]]*\{python[[:space:]},]' hw*/report.qmd; then
            echo "python=true" >> "$GITHUB_OUTPUT"; echo "Python code found."
          fi
          if grep -qsE '^[[:space:]]*```+[[:space:]]*\{r[[:space:]},]' hw*/report.qmd; then
            echo "r=true" >> "$GITHUB_OUTPUT"; echo "R code found."
          fi

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - if: steps.lang.outputs.python == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the locked Python environment
        if: steps.lang.outputs.python == 'true'
        run: uv sync --locked

      - if: steps.lang.outputs.r == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          # Use the exact R version recorded alongside the locked packages.
          r-version: renv
          use-public-rspm: true

      - name: Install the locked R packages
        if: steps.lang.outputs.r == 'true'
        uses: r-lib/actions/setup-renv@v2

      - name: Render every report
        run: |
          if [ "${{ steps.lang.outputs.python }}" = "true" ]; then
            uv run quarto render
          else
            quarto render
          fi

      - name: Explain a red check
        if: failure()
        run: echo "::error title=The report does not render from a fresh clone::Find the first error in the log above, then see https://su-mt4008.github.io/guide#when-the-check-is-red"
