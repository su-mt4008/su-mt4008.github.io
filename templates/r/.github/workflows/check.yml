# Checks that the report renders on a clean computer from what is in the repository.
# Runs on every pull request. Green = anyone can reproduce your report.
name: check

on:
  pull_request:
  workflow_dispatch:

# A newer push cancels the run still going for the same pull request.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Report renders from a fresh clone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install the locked packages
        uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Render the report
        run: quarto render report.qmd

      - name: Explain a red check
        if: failure()
        run: echo "::error title=The report does not render from a fresh clone::Find the first error in the log above, then see https://su-mt4008.github.io/guide#when-the-check-is-red"
