<svg class="fd" viewBox="0 0 1160 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Workflow of the baby names project: one SCB table, cleaned into shares, a comeback score, and a conclusion with its limitation</title>
<style>
.fd text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222);font-size:15px}
.fd .muted{fill:var(--c-muted,#777);font-size:13px}
.fd .lg{font-size:19px;font-weight:600}
.fd .lgm{font-size:15px;fill:var(--c-muted,#777)}
.fd .head{fill:var(--c-muted,#777);font-size:12px;font-weight:600;letter-spacing:.07em}
.fd .big{font-family:'IBM Plex Serif',Georgia,serif;font-size:22px}
.fd text.hot,.fd .hot text{fill:var(--c-accent,#d6453d)}
.fd .box{fill:var(--c-tint,#f4f4f4);stroke:var(--c-line,#ddd);stroke-width:1.5}
.fd .box.hot{stroke:var(--c-accent,#d6453d);stroke-width:2}
.fd .box.solid{fill:var(--c-text,#222);stroke:none}
.fd .solid-text{fill:var(--c-bg,#fff)}
.fd .edge{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.fd .edge.hot{stroke:var(--c-accent,#d6453d)}
.fd .edge.dashed{stroke-dasharray:6 5;stroke:var(--c-muted,#888);stroke-width:1.6}
.fd .tip{fill:var(--c-faint,#bbb)}
.fd .tip.hot{fill:var(--c-accent,#d6453d)}
.fd .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.fd .bar{fill:var(--c-faint,#bbb)}
.fd .bar.hot{fill:var(--c-accent,#d6453d)}
</style>
<style>
.fd .ttl{font-size:16px;font-weight:600}
.fd .det{font-size:13.5px;fill:var(--c-muted,#777)}
.fd text.ttl.hot,.fd text.colhead.hot,.fd text.worknote{fill:var(--c-accent,#d6453d)}
.fd .colhead{fill:var(--c-muted,#777);font-size:12px;font-weight:600;letter-spacing:.07em}
.fd .worknote{font-size:13px;font-weight:600}
.fd .file{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;fill:var(--c-muted,#777)}
</style>
<text class="colhead" x="0" y="30" text-anchor="start">1 · QUESTION</text>
<text class="colhead" x="230" y="30" text-anchor="start">2 · DATA</text>
<text class="colhead" x="490" y="30" text-anchor="start">3 · CLEANING</text>
<text class="colhead" x="736" y="30" text-anchor="start">4 · EXPLORATION ⇄ ANALYSIS</text>
<text class="colhead hot" x="982" y="30" text-anchor="start">5 · CONCLUSIONS</text>
<rect class="box" x="0" y="141" width="184" height="126" rx="7"/>
<text class="ttl" x="13" y="171" text-anchor="start">Are baby names a</text>
<text class="ttl" x="13" y="191" text-anchor="start">fashion?</text>
<text class="det" x="13" y="217" text-anchor="start">Do names come back</text>
<text class="det" x="13" y="235" text-anchor="start">after three</text>
<text class="det" x="13" y="253" text-anchor="start">generations?</text>
<rect class="box" x="490" y="118" width="200" height="172" rx="7"/>
<text class="ttl" x="503" y="148" text-anchor="start">A tidy table</text>
<text class="det" x="503" y="174" text-anchor="start">reshape to one row per</text>
<text class="det" x="503" y="192" text-anchor="start">name and year</text>
<text class="det" x="503" y="216" text-anchor="start">handle SCB&#x27;s hidden</text>
<text class="det" x="503" y="234" text-anchor="start">small counts</text>
<text class="det" x="503" y="258" text-anchor="start">counts → shares of each</text>
<text class="det" x="503" y="276" text-anchor="start">year</text>
<rect class="box hot" x="982" y="130" width="178" height="148" rx="7"/>
<text class="ttl hot" x="995" y="160" text-anchor="start">Yes, with a catch</text>
<text class="det" x="995" y="186" text-anchor="start">Ella, Elsa, Alice,</text>
<text class="det" x="995" y="204" text-anchor="start">Astrid top the score</text>
<text class="det" x="995" y="228" text-anchor="start">limitation: only</text>
<text class="det" x="995" y="246" text-anchor="start">people alive in 2021</text>
<text class="det" x="995" y="264" text-anchor="start">are counted</text>
<rect class="box" x="230" y="147" width="214" height="114" rx="7"/>
<text class="ttl" x="243" y="177" text-anchor="start">Statistics Sweden</text>
<text class="ttl" x="243" y="197" text-anchor="start">(SCB)</text>
<text class="det" x="243" y="223" text-anchor="start">the 200 most common names,</text>
<text class="det" x="243" y="247" text-anchor="start">by year of birth 1922–2021</text>
<path class="edge" d="M184,204.0 L221.0,204.0"/>
<path class="tip" d="M230.0,204.0 L219.0,198.0 L219.0,210.0 Z"/>
<path class="edge" d="M444,204.0 L481.0,204.0"/>
<path class="tip" d="M490.0,204.0 L479.0,198.0 L479.0,210.0 Z"/>
<rect class="box" x="736" y="72" width="200" height="108" rx="7"/>
<text class="ttl" x="749" y="102" text-anchor="start">Each name over 100</text>
<text class="ttl" x="749" y="122" text-anchor="start">years</text>
<text class="det" x="749" y="148" text-anchor="start">plot the share per birth</text>
<text class="det" x="749" y="166" text-anchor="start">year</text>
<rect class="box" x="736" y="230" width="200" height="106" rx="7"/>
<text class="ttl" x="749" y="260" text-anchor="start">A comeback score</text>
<text class="det" x="749" y="286" text-anchor="start">common in 1922–35, rare</text>
<text class="det" x="749" y="304" text-anchor="start">in 1960–80, common again</text>
<text class="det" x="749" y="322" text-anchor="start">in 2005–21</text>
<path class="edge" d="M690,204.0 C713.0,204.0 713.0,126.0 727,126.0"/>
<path class="tip" d="M736.0,126.0 L725.0,120.0 L725.0,132.0 Z"/>
<path class="edge" d="M936,283.0 C959.0,283.0 959.0,204.0 973,204.0"/>
<path class="tip" d="M982.0,204.0 L971.0,198.0 L971.0,210.0 Z"/>
<path class="edge hot" d="M770,180.0 L770.0,221.0"/>
<path class="tip hot" d="M770.0,230.0 L776.0,219.0 L764.0,219.0 Z"/>
<path class="edge hot" d="M902,230.0 L902.0,189.0"/>
<path class="tip hot" d="M902.0,180.0 L896.0,191.0 L908.0,191.0 Z"/>
<text class="muted hot" x="836" y="210" text-anchor="middle">round and round</text>
<text class="worknote" x="982" y="48" text-anchor="start">where the work was</text>
<text class="file" x="337" y="360" text-anchor="middle">fetch.py → data/</text>
<text class="file" x="825" y="360" text-anchor="middle">report.qmd → report.md  (cleaning, analysis, figures, text)</text>
<rect class="box" x="0" y="376" width="1160" height="40" rx="8"/>
<text class="colhead" x="16" y="401" text-anchor="start">REPRODUCIBLE THROUGHOUT</text>
<text class="det" x="236" y="401" text-anchor="start">one command reruns it all:</text>
<text class="file" x="410" y="401" text-anchor="start">uv run quarto render</text>
</svg>
