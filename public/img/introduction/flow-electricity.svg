<text class="ttl" x="243" y="222" text-anchor="start">SMHI wind</text>
<text class="det" x="243" y="248" text-anchor="start">Malmö, every day</text>
<path class="edge" d="M184,209.0 C207.0,209.0 207.0,227.0 221,227.0"/>
<path class="tip" d="M230.0,227.0 L219.0,221.0 L219.0,233.0 Z"/>
