<path class="tip" d="M490.0,209.0 L479.0,203.0 L479.0,215.0 Z"/>
<rect class="box" x="230" y="276" width="214" height="70" rx="7"/>
<text class="ttl" x="243" y="306" text-anchor="start">SMHI temperature</text>
<text class="det" x="243" y="332" text-anchor="start">Malmö, every day</text>
<path class="edge" d="M184,209.0 C207.0,209.0 207.0,311.0 221,311.0"/>
<path class="tip" d="M230.0,311.0 L219.0,305.0 L219.0,317.0 Z"/>
<path class="edge" d="M444,311.0 C467.0,311.0 467.0,209.0 481,209.0"/>
<path class="tip" d="M490.0,209.0 L479.0,203.0 L479.0,215.0 Z"/>
<rect class="box" x="736" y="84" width="200" height="88" rx="7"/>
<text class="ttl" x="749" y="114" text-anchor="start">The gap over time</text>
<text class="det" x="749" y="140" text-anchor="start">Malmö minus Luleå, month</text>
<text class="det" x="749" y="158" text-anchor="start">by month</text>
<rect class="box" x="736" y="222" width="200" height="112" rx="7"/>
<text class="ttl" x="749" y="252" text-anchor="start">Calm vs windy days</text>
<text class="det" x="749" y="278" text-anchor="start">how big is the</text>
<text class="det" x="749" y="296" text-anchor="start">difference?</text>
<text class="det" x="749" y="320" text-anchor="start">how sure are we?</text>
<path class="edge" d="M690,209.0 C713.0,209.0 713.0,128.0 727,128.0"/>
<path class="tip" d="M736.0,128.0 L725.0,122.0 L725.0,134.0 Z"/>
<path class="edge" d="M936,278.0 C959.0,278.0 959.0,209.0 973,209.0"/>
<path class="tip" d="M982.0,209.0 L971.0,203.0 L971.0,215.0 Z"/>
<path class="edge hot" d="M770,172.0 L770.0,213.0"/>
<path class="tip hot" d="M770.0,222.0 L776.0,211.0 L764.0,211.0 Z"/>
<path class="edge hot" d="M902,222.0 L902.0,181.0"/>
<path class="tip hot" d="M902.0,172.0 L896.0,183.0 L908.0,183.0 Z"/>
<text class="muted hot" x="836" y="202" text-anchor="middle">round and round</text>
<text class="worknote" x="490" y="48" text-anchor="start">where the work was</text>
<text class="file" x="337" y="370" text-anchor="middle">fetch_prices.py + fetch_weather.py → data/</text>
<text class="file" x="825" y="370" text-anchor="middle">report.qmd → report.md  (cleaning, analysis, figures, text)</text>
<rect class="box" x="0" y="386" width="1160" height="40" rx="8"/>
<text class="colhead" x="16" y="411" text-anchor="start">REPRODUCIBLE THROUGHOUT</text>
<text class="det" x="236" y="411" text-anchor="start">one command reruns it all:</text>
<text class="file" x="410" y="411" text-anchor="start">uv run quarto render</text>
</svg>
