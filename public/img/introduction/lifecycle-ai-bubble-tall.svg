<svg class="lc lc-tall" viewBox="0 0 640 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Life cycle of the AI bubble project</title>
<style>
.lc text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222)}
.lc .step{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--c-muted,#777)}
.lc .note{font-size:14px}
.lc .src{font-size:13px;fill:var(--c-muted,#777)}
.lc text.hot{fill:var(--c-accent,#d6453d)}
.lc .line{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.lc .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.lc .node.hot{fill:var(--c-accent,#d6453d);stroke:var(--c-accent,#d6453d)}
.lc .dot{fill:var(--c-text,#222)}
</style>
<path class="line" d="M150,24 V387"/>
<text class="step hot" x="128" y="29" text-anchor="end">Question</text>
<circle class="node hot" cx="150" cy="24" r="7"/>
<text class="note hot" x="182" y="29">“Bubble” is not measurable: turn it into</text>
<text class="note hot" x="182" y="50">three signs</text>
<text class="step" x="128" y="93" text-anchor="end">Data</text>
<path class="line" d="M174,88 C174,143 150,133 150,173"/>
<circle class="dot" cx="174" cy="88" r="4"/>
<text class="src" x="186" y="93">Shiller: valuations since 1871</text>
<path class="line" d="M174,109 C174,143 150,133 150,173"/>
<circle class="dot" cx="174" cy="109" r="4"/>
<text class="src" x="186" y="114">FRED: the NASDAQ index</text>
<path class="line" d="M174,130 C174,143 150,133 150,173"/>
<circle class="dot" cx="174" cy="130" r="4"/>
<text class="src" x="186" y="135">Hacker News titles (API)</text>
<text class="step" x="128" y="178" text-anchor="end">Cleaning</text>
<circle class="node" cx="150" cy="173" r="7"/>
<text class="note" x="182" y="178">dates like 2026.1 mean October; counts →</text>
<text class="note" x="182" y="199">shares</text>
<text class="step" x="128" y="242" text-anchor="end">Exploration</text>
<circle class="node" cx="150" cy="237" r="7"/>
<text class="note" x="182" y="242">each sign against its own history</text>
<text class="step" x="128" y="285" text-anchor="end">Analysis</text>
<circle class="node" cx="150" cy="280" r="7"/>
<text class="note" x="182" y="285">compare with 1929, 2000 and the crypto boom</text>
<text class="step" x="128" y="328" text-anchor="end">Conclusions</text>
<circle class="node" cx="150" cy="323" r="7"/>
<text class="note" x="182" y="328">2 of 3 signs are there; a crash is not in</text>
<text class="note" x="182" y="349">the data</text>
<text class="step" x="128" y="392" text-anchor="end">Reproduce</text>
<circle class="node" cx="150" cy="387" r="7"/>
<text class="note" x="182" y="392">one fetch script, three sources saved</text>
</svg>
