<svg class="fd" viewBox="0 0 800 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The data science cycle: question, data, then cleaning, exploration and analysis round and round, then conclusions; arrows back to the data and the question; all of it reproducible</title>
<style>
.fd text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222);font-size:15px}
.fd .muted{fill:var(--c-muted,#777);font-size:13px}
.fd .lg{font-size:19px;font-weight:600}
.fd .lgm{font-size:15px;fill:var(--c-muted,#777)}
.fd .head{fill:var(--c-muted,#777);font-size:12px;font-weight:600;letter-spacing:.07em}
.fd .big{font-family:'IBM Plex Serif',Georgia,serif;font-size:22px}
.fd text.hot,.fd .hot text{fill:var(--c-accent,#d6453d)}
.fd .box{fill:var(--c-tint,#f4f4f4);stroke:var(--c-line,#ddd);stroke-width:1.5}
.fd .box.hot{stroke:var(--c-accent,#d6453d);stroke-width:2}
.fd .box.solid{fill:var(--c-text,#222);stroke:none}
.fd .solid-text{fill:var(--c-bg,#fff)}
.fd .edge{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.fd .edge.hot{stroke:var(--c-accent,#d6453d)}
.fd .edge.dashed{stroke-dasharray:6 5;stroke:var(--c-muted,#888);stroke-width:1.6}
.fd .tip{fill:var(--c-faint,#bbb)}
.fd .tip.hot{fill:var(--c-accent,#d6453d)}
.fd .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.fd .bar{fill:var(--c-faint,#bbb)}
.fd .bar.hot{fill:var(--c-accent,#d6453d)}
</style>
<rect class="box" x="6" y="6" width="788" height="408" rx="14" style="fill:none;stroke-width:2"/>
<rect class="box " x="20" y="170" width="90" height="60" rx="6"/>
<text class="lg" x="65" y="205" text-anchor="middle">Question</text>
<rect class="box " x="134" y="170" width="90" height="60" rx="6"/>
<text class="lg" x="179" y="205" text-anchor="middle">Data</text>
<rect class="box" x="250" y="146" width="408" height="182" rx="12" style="fill:none;stroke-dasharray:5 5"/>
<rect class="box " x="264" y="170" width="112" height="60" rx="6"/>
<text class="lg" x="320" y="205" text-anchor="middle">Cleaning</text>
<rect class="box " x="398" y="170" width="112" height="60" rx="6"/>
<text class="lg" x="454" y="205" text-anchor="middle">Exploration</text>
<rect class="box " x="532" y="170" width="112" height="60" rx="6"/>
<text class="lg" x="588" y="205" text-anchor="middle">Analysis</text>
<rect class="box solid" x="684" y="170" width="98" height="60" rx="6"/>
<text class="solid-text" x="733" y="205" text-anchor="middle">Conclusions</text>
<path class="edge" d="M110,200 L125.0,200.0"/>
<path class="tip" d="M134.0,200.0 L123.0,194.0 L123.0,206.0 Z"/>
<path class="edge" d="M224,200 L255.0,200.0"/>
<path class="tip" d="M264.0,200.0 L253.0,194.0 L253.0,206.0 Z"/>
<path class="edge" d="M376,200 L389.0,200.0"/>
<path class="tip" d="M398.0,200.0 L387.0,194.0 L387.0,206.0 Z"/>
<path class="edge" d="M510,200 L523.0,200.0"/>
<path class="tip" d="M532.0,200.0 L521.0,194.0 L521.0,206.0 Z"/>
<path class="edge" d="M644,200 L675.0,200.0"/>
<path class="tip" d="M684.0,200.0 L673.0,194.0 L673.0,206.0 Z"/>
<path class="edge hot" d="M588,230 C588,282 320,282 320.0,243.0"/>
<path class="tip hot" d="M320.0,234.0 L314.0,245.0 L326.0,245.0 Z"/>
<text class="muted hot" x="454" y="312" text-anchor="middle">round and round, until it holds up</text>
<path class="edge dashed" d="M454,170 L454,112 L179,112 L179.0,161.0"/>
<path class="tip" d="M179.0,170.0 L185.0,159.0 L173.0,159.0 Z"/>
<text class="muted" x="316" y="104" text-anchor="middle">the data can&#x27;t answer it: get other data</text>
<path class="edge dashed" d="M588,170 L588,60 L65,60 L65.0,161.0"/>
<path class="tip" d="M65.0,170.0 L71.0,159.0 L59.0,159.0 Z"/>
<text class="muted" x="326" y="52" text-anchor="middle">sharpen the question</text>
<text class="head" x="400" y="366" text-anchor="middle">REPRODUCIBLE THROUGHOUT</text>
<text class="muted" x="400" y="390" text-anchor="middle">code, not clicks · relative paths · a lockfile · Quarto · Git</text>
</svg>
