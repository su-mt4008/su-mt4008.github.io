<svg class="fd" viewBox="0 0 800 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The data science cycle: question, data, cleaning, then exploration and analysis round and round, then conclusions; to answer more, back to the data or the question; all of it reproducible</title>
<style>
.fd text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222);font-size:15px}
.fd .muted{fill:var(--c-muted,#777);font-size:13px}
.fd .lg{font-size:19px;font-weight:600}
.fd .lgm{font-size:15px;fill:var(--c-muted,#777)}
.fd .head{fill:var(--c-muted,#777);font-size:12px;font-weight:600;letter-spacing:.07em}
.fd .big{font-family:'IBM Plex Serif',Georgia,serif;font-size:22px}
.fd text.hot,.fd .hot text{fill:var(--c-accent,#d6453d)}
.fd .box{fill:var(--c-tint,#f4f4f4);stroke:var(--c-line,#ddd);stroke-width:1.5}
.fd .box.hot{stroke:var(--c-accent,#d6453d);stroke-width:2}
.fd .box.solid{fill:var(--c-text,#222);stroke:none}
.fd .solid-text{fill:var(--c-bg,#fff)}
.fd .edge{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.fd .edge.hot{stroke:var(--c-accent,#d6453d)}
.fd .edge.dashed{stroke-dasharray:6 5;stroke:var(--c-muted,#888);stroke-width:1.6}
.fd .tip{fill:var(--c-faint,#bbb)}
.fd .tip.hot{fill:var(--c-accent,#d6453d)}
.fd .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.fd .bar{fill:var(--c-faint,#bbb)}
.fd .bar.hot{fill:var(--c-accent,#d6453d)}
</style>
<rect class="box" x="6" y="6" width="788" height="408" rx="14" style="fill:none;stroke-width:2"/>
<rect class="box " x="20" y="170" width="90" height="60" rx="6"/>
<text class="lg" x="65" y="205" text-anchor="middle">Question</text>
<rect class="box " x="132" y="170" width="90" height="60" rx="6"/>
<text class="lg" x="177" y="205" text-anchor="middle">Data</text>
<rect class="box " x="244" y="170" width="100" height="60" rx="6"/>
<text class="lg" x="294" y="205" text-anchor="middle">Cleaning</text>
<rect class="box" x="370" y="146" width="284" height="182" rx="12" style="fill:none;stroke-dasharray:5 5"/>
<rect class="box " x="386" y="170" width="112" height="60" rx="6"/>
<text class="lg" x="442" y="205" text-anchor="middle">Exploration</text>
<rect class="box " x="526" y="170" width="112" height="60" rx="6"/>
<text class="lg" x="582" y="205" text-anchor="middle">Analysis</text>
<rect class="box solid" x="684" y="170" width="98" height="60" rx="6"/>
<text class="solid-text" x="733" y="205" text-anchor="middle">Conclusions</text>
<path class="edge" d="M110,200 L123.0,200.0"/>
<path class="tip" d="M132.0,200.0 L121.0,194.0 L121.0,206.0 Z"/>
<path class="edge" d="M222,200 L235.0,200.0"/>
<path class="tip" d="M244.0,200.0 L233.0,194.0 L233.0,206.0 Z"/>
<path class="edge" d="M344,200 L377.0,200.0"/>
<path class="tip" d="M386.0,200.0 L375.0,194.0 L375.0,206.0 Z"/>
<path class="edge" d="M498,200 L517.0,200.0"/>
<path class="tip" d="M526.0,200.0 L515.0,194.0 L515.0,206.0 Z"/>
<path class="edge" d="M638,200 L675.0,200.0"/>
<path class="tip" d="M684.0,200.0 L673.0,194.0 L673.0,206.0 Z"/>
<path class="edge hot" d="M582,230 C582,282 442,282 442.0,243.0"/>
<path class="tip hot" d="M442.0,234.0 L436.0,245.0 L448.0,245.0 Z"/>
<text class="muted hot" x="512" y="312" text-anchor="middle">round and round</text>
<path class="edge dashed" d="M442,170 L442,112 L177,112 L177.0,161.0"/>
<path class="tip" d="M177.0,170.0 L183.0,159.0 L171.0,159.0 Z"/>
<text class="muted" x="310" y="104" text-anchor="middle">to answer more: fetch more data</text>
<path class="edge dashed" d="M582,170 L582,60 L65,60 L65.0,161.0"/>
<path class="tip" d="M65.0,170.0 L71.0,159.0 L59.0,159.0 Z"/>
<text class="muted" x="324" y="52" text-anchor="middle">refine the question</text>
<text class="head" x="400" y="366" text-anchor="middle">REPRODUCIBLE THROUGHOUT</text>
<text class="muted" x="400" y="390" text-anchor="middle">code, not clicks · relative paths · a lockfile · Quarto · Git</text>
</svg>
