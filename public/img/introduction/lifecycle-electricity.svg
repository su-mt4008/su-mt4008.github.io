<svg class="lc" viewBox="0 0 1100 222" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Life cycle of the electricity price project</title>
<style>
.lc text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222)}
.lc .step{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--c-muted,#777)}
.lc .note{font-size:14px}
.lc .src{font-size:13px;fill:var(--c-muted,#777)}
.lc text.hot{fill:var(--c-accent,#d6453d)}
.lc .line{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.lc .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.lc .node.hot{fill:var(--c-accent,#d6453d);stroke:var(--c-accent,#d6453d)}
.lc .dot{fill:var(--c-text,#222)}
</style>
<path class="line" d="M70,126 H1030"/>
<path class="line" d="M203.33333333333334,66 H335.3333333333333 C423.33333333333326,66 438.0,126 496.66666666666663,126"/>
<circle class="dot" cx="203.33333333333334" cy="66" r="4"/>
<text class="src" x="215.33333333333334" y="58">Spot prices, 4 zones (API)</text>
<path class="line" d="M203.33333333333334,96 H335.3333333333333 C423.33333333333326,96 438.0,126 496.66666666666663,126"/>
<circle class="dot" cx="203.33333333333334" cy="96" r="4"/>
<text class="src" x="215.33333333333334" y="88">SMHI wind, Malmö</text>
<circle class="dot" cx="203.33333333333334" cy="126" r="4"/>
<text class="src" x="215.33333333333334" y="118">SMHI temperature, Malmö</text>
<text class="step" x="70.0" y="30" text-anchor="middle">Question</text>
<circle class="node" cx="70.0" cy="126" r="7"/>
<text class="note" x="70.0" y="162" text-anchor="middle">How big is the</text>
<text class="note" x="70.0" y="182" text-anchor="middle">south–north gap,</text>
<text class="note" x="70.0" y="202" text-anchor="middle">and is it the wind?</text>
<text class="step" x="203.33333333333334" y="30" text-anchor="start" dx="-8">Data</text>
<text class="step hot" x="496.66666666666663" y="30" text-anchor="middle">Cleaning</text>
<circle class="node hot" cx="496.66666666666663" cy="126" r="7"/>
<text class="note hot" x="496.66666666666663" y="162" text-anchor="middle">15-min vs hourly,</text>
<text class="note hot" x="496.66666666666663" y="182" text-anchor="middle">clock changes,</text>
<text class="note hot" x="496.66666666666663" y="202" text-anchor="middle">join on the date</text>
<text class="step" x="630.0" y="30" text-anchor="middle">Exploration</text>
<circle class="node" cx="630.0" cy="126" r="7"/>
<text class="note" x="630.0" y="162" text-anchor="middle">prices per zone</text>
<text class="note" x="630.0" y="182" text-anchor="middle">over 3 years</text>
<text class="step" x="763.3333333333334" y="30" text-anchor="middle">Analysis</text>
<circle class="node" cx="763.3333333333334" cy="126" r="7"/>
<text class="note" x="763.3333333333334" y="162" text-anchor="middle">calm vs windy days,</text>
<text class="note" x="763.3333333333334" y="182" text-anchor="middle">bootstrap,</text>
<text class="note" x="763.3333333333334" y="202" text-anchor="middle">straight-line fit</text>
<text class="step" x="896.6666666666666" y="30" text-anchor="middle">Conclusions</text>
<circle class="node" cx="896.6666666666666" cy="126" r="7"/>
<text class="note" x="896.6666666666666" y="162" text-anchor="middle">0.40 kr/kWh more</text>
<text class="note" x="896.6666666666666" y="182" text-anchor="middle">on calm days;</text>
<text class="note" x="896.6666666666666" y="202" text-anchor="middle">weather explains 18 %</text>
<text class="step" x="1030.0" y="30" text-anchor="middle">Reproduce</text>
<circle class="node" cx="1030.0" cy="126" r="7"/>
<text class="note" x="1030.0" y="162" text-anchor="middle">two fetch scripts,</text>
<text class="note" x="1030.0" y="182" text-anchor="middle">saved raw data</text>
</svg>
