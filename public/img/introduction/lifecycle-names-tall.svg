<svg class="lc lc-tall" viewBox="0 0 640 368" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Life cycle of the baby names project</title>
<style>
.lc text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222)}
.lc .step{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--c-muted,#777)}
.lc .note{font-size:14px}
.lc .src{font-size:13px;fill:var(--c-muted,#777)}
.lc text.hot{fill:var(--c-accent,#d6453d)}
.lc .line{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.lc .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.lc .node.hot{fill:var(--c-accent,#d6453d);stroke:var(--c-accent,#d6453d)}
.lc .dot{fill:var(--c-text,#222)}
.lc .band{fill:var(--c-tint,#f4f4f4);stroke:var(--c-line,#ddd)}
.lc .bandtext{font-size:13px;fill:var(--c-muted,#777)}
.lc .bandtext tspan.head{font-weight:600;letter-spacing:.06em}
.lc .loop{stroke:var(--c-accent,#d6453d);stroke-width:1.6;fill:none}
.lc .looptip{fill:var(--c-accent,#d6453d)}
.lc text.loopnote{font-size:12px;fill:var(--c-accent,#d6453d)}
</style>
<path class="line" d="M162,24 V260"/>
<text class="step" x="126" y="29" text-anchor="end">Question</text>
<circle class="node" cx="162" cy="24" r="7"/>
<text class="note" x="192" y="29">Do names come back after three generations?</text>
<text class="step" x="126" y="72" text-anchor="end">Data</text>
<circle class="node" cx="162" cy="67" r="7"/>
<text class="note" x="192" y="72">SCB: 200 names by year of birth</text>
<text class="step" x="126" y="115" text-anchor="end">Cleaning</text>
<circle class="node" cx="162" cy="110" r="7"/>
<text class="note" x="192" y="115">reshape the table, handle gaps, counts →</text>
<text class="note" x="192" y="136">shares</text>
<text class="step" x="126" y="179" text-anchor="end">Exploration</text>
<circle class="node" cx="162" cy="174" r="7"/>
<text class="note" x="192" y="179">share of each birth year</text>
<text class="step" x="126" y="222" text-anchor="end">Analysis</text>
<circle class="node" cx="162" cy="217" r="7"/>
<text class="note" x="192" y="222">a comeback score</text>
<text class="step hot" x="126" y="265" text-anchor="end">Conclusions</text>
<circle class="node hot" cx="162" cy="260" r="7"/>
<text class="note hot" x="192" y="265">yes: Elsa, Alice, Astrid … but only the</text>
<text class="note hot" x="192" y="286">living are counted</text>
<path class="loop" d="M153,217 C134,207 134,184 150,178"/>
<path class="looptip" d="M154,176 L144,173 L147,183 Z"/>
<text class="loopnote" x="192" y="244">↻ exploration and analysis, round and round</text>
<rect class="band" x="20" y="318" width="600" height="30" rx="15"/>
<text class="bandtext" x="320.0" y="338" text-anchor="middle"><tspan class="head">REPRODUCIBLE THROUGHOUT</tspan>  ·  fetch.py + report.qmd</text>
</svg>
