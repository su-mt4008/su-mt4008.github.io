<text class="ttl" x="243" y="204" text-anchor="start">FRED</text>
<text class="det" x="243" y="230" text-anchor="start">the NASDAQ index, since</text>
<text class="det" x="243" y="248" text-anchor="start">1971</text>
<path class="edge" d="M184,209.0 C207.0,209.0 207.0,218.0 221,218.0"/>
<path class="tip" d="M230.0,218.0 L219.0,212.0 L219.0,224.0 Z"/>
