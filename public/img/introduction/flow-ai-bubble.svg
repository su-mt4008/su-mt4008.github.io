<svg class="fd" viewBox="0 0 1160 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Workflow of the AI bubble project: a vague question turned into three measurable signs, three sources lined up by month, today compared with past bubbles</title>
<style>
.fd text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222);font-size:15px}
.fd .muted{fill:var(--c-muted,#777);font-size:13px}
.fd .lg{font-size:19px;font-weight:600}
.fd .lgm{font-size:15px;fill:var(--c-muted,#777)}
.fd .head{fill:var(--c-muted,#777);font-size:12px;font-weight:600;letter-spacing:.07em}
.fd .big{font-family:'IBM Plex Serif',Georgia,serif;font-size:22px}
.fd text.hot,.fd .hot text{fill:var(--c-accent,#d6453d)}
.fd .box{fill:var(--c-tint,#f4f4f4);stroke:var(--c-line,#ddd);stroke-width:1.5}
.fd .box.hot{stroke:var(--c-accent,#d6453d);stroke-width:2}
.fd .box.solid{fill:var(--c-text,#222);stroke:none}
.fd .solid-text{fill:var(--c-bg,#fff)}
.fd .edge{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.fd .edge.hot{stroke:var(--c-accent,#d6453d)}
.fd .edge.dashed{stroke-dasharray:6 5;stroke:var(--c-muted,#888);stroke-width:1.6}
.fd .tip{fill:var(--c-faint,#bbb)}
.fd .tip.hot{fill:var(--c-accent,#d6453d)}
.fd .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.fd .bar{fill:var(--c-faint,#bbb)}
.fd .bar.hot{fill:var(--c-accent,#d6453d)}
</style>
<style>
.fd .ttl{font-size:16px;font-weight:600}
.fd .det{font-size:13.5px;fill:var(--c-muted,#777)}
.fd text.ttl.hot,.fd text.colhead.hot,.fd text.worknote{fill:var(--c-accent,#d6453d)}
.fd .colhead{fill:var(--c-muted,#777);font-size:12px;font-weight:600;letter-spacing:.07em}
.fd .worknote{font-size:13px;font-weight:600}
.fd .file{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;fill:var(--c-muted,#777)}
</style>
<text class="colhead hot" x="0" y="30" text-anchor="start">1 · QUESTION</text>
<text class="colhead" x="230" y="30" text-anchor="start">2 · DATA</text>
<text class="colhead" x="490" y="30" text-anchor="start">3 · CLEANING</text>
<text class="colhead" x="736" y="30" text-anchor="start">4 · EXPLORATION ⇄ ANALYSIS</text>
<text class="colhead" x="982" y="30" text-anchor="start">5 · CONCLUSIONS</text>
<rect class="box hot" x="0" y="123" width="184" height="172" rx="7"/>
<text class="ttl hot" x="13" y="153" text-anchor="start">Is AI a bubble?</text>
<text class="det" x="13" y="179" text-anchor="start">can&#x27;t be measured</text>
<text class="det" x="13" y="197" text-anchor="start">directly</text>
<text class="det" x="13" y="221" text-anchor="start">so: three signs we can</text>
<text class="det" x="13" y="239" text-anchor="start">measure</text>
<text class="det" x="13" y="263" text-anchor="start">valuations, price</text>
<text class="det" x="13" y="281" text-anchor="start">growth, attention</text>
<rect class="box" x="490" y="123" width="200" height="172" rx="7"/>
<text class="ttl" x="503" y="153" text-anchor="start">Months, comparable</text>
<text class="det" x="503" y="179" text-anchor="start">line up the sources by</text>
<text class="det" x="503" y="197" text-anchor="start">month</text>
<text class="det" x="503" y="221" text-anchor="start">Shiller writes October</text>
<text class="det" x="503" y="239" text-anchor="start">as .1</text>
<text class="det" x="503" y="263" text-anchor="start">counts → shares of</text>
<text class="det" x="503" y="281" text-anchor="start">headlines</text>
<rect class="box" x="982" y="122" width="178" height="174" rx="7"/>
<text class="ttl" x="995" y="152" text-anchor="start">Two of three</text>
<text class="ttl" x="995" y="172" text-anchor="start">signs</text>
<text class="det" x="995" y="198" text-anchor="start">valuations and</text>
<text class="det" x="995" y="216" text-anchor="start">attention: yes</text>
<text class="det" x="995" y="240" text-anchor="start">price growth: no</text>
<text class="det" x="995" y="264" text-anchor="start">a crash is not in the</text>
<text class="det" x="995" y="282" text-anchor="start">data</text>
<rect class="box" x="230" y="72" width="214" height="88" rx="7"/>
<text class="ttl" x="243" y="102" text-anchor="start">Robert Shiller</text>
<text class="det" x="243" y="128" text-anchor="start">prices vs earnings, since</text>
<text class="det" x="243" y="146" text-anchor="start">1871</text>
<path class="edge" d="M184,209.0 C207.0,209.0 207.0,116.0 221,116.0"/>
<path class="tip" d="M230.0,116.0 L219.0,110.0 L219.0,122.0 Z"/>
<path class="edge" d="M444,116.0 C467.0,116.0 467.0,209.0 481,209.0"/>
<path class="tip" d="M490.0,209.0 L479.0,203.0 L479.0,215.0 Z"/>
