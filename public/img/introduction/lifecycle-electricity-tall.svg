<svg class="lc lc-tall" viewBox="0 0 640 452" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Life cycle of the electricity price project</title>
<style>
.lc text{font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif);fill:var(--c-text,#222)}
.lc .step{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--c-muted,#777)}
.lc .note{font-size:14px}
.lc .src{font-size:13px;fill:var(--c-muted,#777)}
.lc text.hot{fill:var(--c-accent,#d6453d)}
.lc .line{stroke:var(--c-faint,#bbb);stroke-width:2;fill:none}
.lc .node{fill:var(--c-bg,#fff);stroke:var(--c-text,#222);stroke-width:2}
.lc .node.hot{fill:var(--c-accent,#d6453d);stroke:var(--c-accent,#d6453d)}
.lc .dot{fill:var(--c-text,#222)}
.lc .band{fill:var(--c-tint,#f4f4f4);stroke:var(--c-line,#ddd)}
.lc .bandtext{font-size:13px;fill:var(--c-muted,#777)}
.lc .bandtext tspan.head{font-weight:600;letter-spacing:.06em}
.lc .loop{stroke:var(--c-accent,#d6453d);stroke-width:1.6;fill:none}
.lc .looptip{fill:var(--c-accent,#d6453d)}
.lc text.loopnote{font-size:12px;fill:var(--c-accent,#d6453d)}
</style>
<path class="line" d="M162,24 V344"/>
<text class="step" x="126" y="29" text-anchor="end">Question</text>
<circle class="node" cx="162" cy="24" r="7"/>
<text class="note" x="192" y="29">How big is the south–north gap, and is it</text>
<text class="note" x="192" y="50">the wind?</text>
<text class="step" x="126" y="93" text-anchor="end">Data</text>
<path class="line" d="M184,88 C184,143 162,133 162,173"/>
<circle class="dot" cx="184" cy="88" r="4"/>
<text class="src" x="196" y="93">Electricity prices, 4 zones</text>
<path class="line" d="M184,109 C184,143 162,133 162,173"/>
<circle class="dot" cx="184" cy="109" r="4"/>
<text class="src" x="196" y="114">SMHI wind, Malmö</text>
<path class="line" d="M184,130 C184,143 162,133 162,173"/>
<circle class="dot" cx="184" cy="130" r="4"/>
<text class="src" x="196" y="135">SMHI temperature, Malmö</text>
<text class="step hot" x="126" y="178" text-anchor="end">Cleaning</text>
<circle class="node hot" cx="162" cy="173" r="7"/>
<text class="note hot" x="192" y="178">one price a day, clock changes, match to</text>
<text class="note hot" x="192" y="199">weather</text>
<text class="step" x="126" y="242" text-anchor="end">Exploration</text>
<circle class="node" cx="162" cy="237" r="7"/>
<text class="note" x="192" y="242">prices per zone over 3 years</text>
<text class="step" x="126" y="285" text-anchor="end">Analysis</text>
<circle class="node" cx="162" cy="280" r="7"/>
<text class="note" x="192" y="285">calm vs windy days: how sure, how much</text>
<text class="note" x="192" y="306">weather?</text>
<text class="step" x="126" y="349" text-anchor="end">Conclusions</text>
<circle class="node" cx="162" cy="344" r="7"/>
<text class="note" x="192" y="349">0.40 kr/kWh more on calm days; weather</text>
<text class="note" x="192" y="370">explains 18 %</text>
<path class="loop" d="M153,280 C134,270 134,247 150,241"/>
<path class="looptip" d="M154,239 L144,236 L147,246 Z"/>
<text class="loopnote" x="192" y="328">↻ exploration and analysis, round and round</text>
<rect class="band" x="20" y="402" width="600" height="30" rx="15"/>
<text class="bandtext" x="320.0" y="422" text-anchor="middle"><tspan class="head">REPRODUCIBLE THROUGHOUT</tspan>  ·  two fetch scripts, saved raw data</text>
</svg>
